[project]
name = "exaspim-submitter"
version = "0.1.0"
description = "Submit ExaSPIM IMS-to-Zarr upload jobs to aind-data-transfer-service."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aind-codeocean-pipeline-monitor==0.11.2",
    "aind-data-schema-models==5.7.3",
    "aind-data-transfer-service==2.0.2",
    "codeocean==0.13.0",
    "requests>=2.32,<3",
]

[project.scripts]
exaspim-submit = "exaspim_submitter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exaspim_submitter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
