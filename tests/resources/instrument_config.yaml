instrument:
  id: exaspim-1x
  channels:
    '405':
      lasers: [405 nm]
      cameras: [vnp-604mx]
      focusing_stages: [camera]
      flip_mounts: [left_right_flip_mount]
    '488':
      lasers: [488 nm]
      cameras: [vnp-604mx]
      focusing_stages: [camera]
      flip_mounts: [left_right_flip_mount]
    '561':
      lasers: [561 nm]
      cameras: [vnp-604mx]
      focusing_stages: [camera]
      flip_mounts: [left_right_flip_mount]
    '639':
      lasers: [639 nm]
      cameras: [vnp-604mx]
      focusing_stages: [camera]
      flip_mounts: [left_right_flip_mount]
  devices:
    indicator_light:
      type: indicator_light
      driver: voxel.devices.indicator_light.banner_engineering.tl50
      module: TL50IndicatorLight
      init:
        com_port: COM7
      properties:
        settings:
          color1: green
          intensity1: medium
          animation: intensity sweep
          speed: standard
          flash_pattern: normal
          color2: green
          intensity2: medium
          direction: clockwise
    vnp-604mx:
      type: camera
      driver: voxel.devices.camera.vieworks.egrabber
      module: VieworksCamera
      init:
        id: MB151BAY001
      properties:
        binning: 1
        bit_packing_mode: msb
        exposure_time_ms: 80.0
        fov_height_mm: 40.00639999999999
        fov_width_mm: 53.36192
        frame_number: 0
        frame_time_ms: 568.9343774989917
        height_offset_px: 0
        height_px: 10640
        image_height_px: 10640
        image_width_px: 14192
        line_interval_us: 45.952479088251096
        mainboard_temperature_c: 45.04388427734375
        pixel_type: mono12
        readout_mode: rolling shutter
        sampling_um_px: 3.76
        sensor_height_px: 10640
        sensor_temperature_c: 5.63507080078125
        sensor_width_px: 14192
        trigger:
          mode: on
          source: line0
          polarity: risingedge
        um_px: 3.76
        width_offset_px: 0
        width_px: 14192
    oxxius_controller:
      type: controller
      driver: voxel.devices.controller.oxxius.lxcc
      module: OxxiusController
      init:
        port: COM4
        model: L6cc
      subdevices:
        405 nm:
          type: laser
          driver: voxel.devices.laser.oxxius.lbx
          module: OxxiusLBXLaser
          init:
            id: 405 nm
            wavelength: 405
            prefix: L6
            coefficients:
              2: 0.0081
              1: 0.915
              0: -10.534
          properties:
            modulation_mode: digital
        488 nm:
          type: laser
          driver: voxel.devices.laser.oxxius.lbx
          module: OxxiusLBXLaser
          init:
            id: 488 nm
            wavelength: 488
            prefix: L5
            coefficients:
              2: 0.005
              1: 1.6896
              0: -19.721
          properties:
            modulation_mode: digital
        561 nm:
          type: laser
          driver: voxel.devices.laser.oxxius.lcx
          module: OxxiusLCXLaser
          init:
            id: 561 nm
            wavelength: 561
            prefix: L3
          properties:
            aom_power_mw: 200.0
        639 nm:
          type: laser
          driver: voxel.devices.laser.oxxius.lbx
          module: OxxiusLBXLaser
          init:
            id: 639 nm
            wavelength: 639
            prefix: L1
            coefficients:
              2: -0.0036
              1: 2.5547
              0: -26.702
          properties:
            modulation_mode: digital
      properties: {}
    tiger controller:
      type: controller
      driver: voxel.devices.controller.asi.tiger
      module: TigerController
      init:
        com_port: COM6
      subdevices:
        z:
          type: scanning_stage
          driver: voxel.devices.stage.asi.tiger
          module: TigerStage
          init:
            hardware_axis: z
            instrument_axis: z
          properties:
            mode: step shoot
            speed_mm_s: 1.0
            backlash_mm: 0.0
            acceleration_ms: 200.0
        x:
          type: tiling_stage
          driver: voxel.devices.stage.asi.tiger
          module: TigerStage
          init:
            hardware_axis: x
            instrument_axis: x
          properties:
            mode: off
            speed_mm_s: 1.0
            backlash_mm: 0.004
            acceleration_ms: 200.0
        y:
          type: tiling_stage
          driver: voxel.devices.stage.asi.tiger
          module: TigerStage
          init:
            hardware_axis: y
            instrument_axis: y
          properties:
            mode: off
            speed_mm_s: 1.0
            backlash_mm: 0.004
            acceleration_ms: 200.0
        theta:
          type: focusing_stage
          driver: voxel.devices.stage.asi.tiger
          module: TigerStage
          init:
            hardware_axis: t
            instrument_axis: t
          properties:
            mode: off
            speed_mm_s: 0.3
            backlash_mm: 0.004
            acceleration_ms: 200.0
        camera:
          type: focusing_stage
          driver: voxel.devices.stage.asi.tiger
          module: TigerStage
          init:
            hardware_axis: m
            instrument_axis: m
          properties:
            mode: off
            speed_mm_s: 0.01
            backlash_mm: 0.004
            acceleration_ms: 20.0
      properties: {}
    left_right_flip_mount:
      type: flip_mount
      driver: voxel.devices.flip_mount.thorlabs.mff101
      module: MFF101FlipMount
      init:
        id: 37007748
        positions:
          right: 0
          left: 1
      properties:
        flip_time_ms: 500
        position: left
    pcie-6738:
